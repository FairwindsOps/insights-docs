version: 2.1

orbs:
  rok8s: fairwinds/rok8s-scripts@11
  oss-docs: fairwinds/oss-docs@0

references:
  test_and_build: &test_and_build
    name: Build Docs Site
    command: |
      set -e
      cd ./docs
      npm install
      npm run check-links
      npm run build

jobs:
  test:
    docker:
      - image: cimg/node:26.13.0
    steps:
      - checkout
      - run: *test_and_build

  # fairwinds/oss-docs@0 publishes on cimg/node:16.15. Vite 6 needs Node 22+.
  publish:
    docker:
      - image: cimg/node:26.13.0
    steps:
      - checkout
      - run: *test_and_build
      - oss-docs/install-tools
      - rok8s/get_vault_aws_credentials:
          vault_path: fairwindsops/sts/insights-docs-docs
      - rok8s/get_vault_env:
          vault_path: repo/insights-docs/env
      - oss-docs/publish-docs-site:
          repository: insights-docs
          bucket-name-override: insights.docs.fairwinds.com

workflows:
  version: 2
  release:
    jobs:
      - test:
          filters:
            branches:
              ignore: main
      - publish:
          filters:
            branches:
              only: main
